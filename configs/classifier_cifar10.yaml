seed: 69420

data:
  root: "data"
  batch_size: 256
  num_workers: 2
  val_fraction: 0.1
  download: true

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule: "linear"
  sampling_strategy: "linear_decay"  # Options: "uniform", "linear_decay", "inverse_power", "exponential", "cosine"

model:
  name: unet
  num_classes: 10
  base_channels: 128
  time_embedding_dim: 128
  dropout: 0.1
  activation: "gelu"
  blocks_per_stage: 4

training:
  epochs: 100
  lr: 0.0003
  weight_decay: 0.00001
  amp: true
  grad_clip: 1.0
  log_every: 20

checkpoint:
  dir: "checkpoints"
  filename: "classifier_cifar10_unet256LinearDecayLr3Res7.pt"