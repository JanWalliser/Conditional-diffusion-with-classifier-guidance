seed: 69420

data:
  root: "data"
  batch_size: 72
  num_workers: 2
  val_fraction: 0.1
  download: true

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule: "linear"

# Stage 2 of the sine classifier experiment.
# Resume from stage 1. epochs: 100 means epochs 81--100 when resumed from epoch 80.
timestep_sampling:
  strategy: "sine"
  power: 1.0
  floor: 0.30

model:
  name: unet
  in_channels: 3
  num_classes: 10
  input_size: 32
  base_channels: 128
  time_embedding_dim: 128
  channel_mults: [1, 2, 4]
  blocks_per_stage: 4
  dropout: 0.2
  attention_resolutions: [8]
  channels_per_head: 64

training:
  epochs: 100
  lr: 0.00005
  weight_decay: 0.00001
  amp: true
  grad_clip: 1.0
  log_every: 20

validation:
  fixed_timesteps: [1, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 950, 999]

checkpoint:
  dir: "checkpoints/experiments"
  filename: "classifier_cifar10_unet128_sine_power1_finetune_full.pt"
